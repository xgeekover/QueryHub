// adapter-metadata: 메타데이터 저장소 (내장 SQLite, Spring JDBC, Flyway 마이그레이션, 저장소 파일 검사). ADR-026.
// application 의 포트(*Repository)를 구현한다. 빈 등록과 접속 설정은 app 이 맡는다(이 모듈에는 Spring 스테레오타입이 없다).
dependencies {
    implementation project(':application')
    implementation libs.spring.boot.starter.jdbc
    // Flyway 의 SQLite 지원은 flyway-core 안에 있다 (별도 모듈이 없다).
    implementation libs.spring.boot.starter.flyway
    // 드라이버 클래스(org.sqlite.*)는 코드에서 참조하지 않는다(ArchUnit R6). 실행 시에만 필요하다.
    // OS·아키텍처별 네이티브 라이브러리가 이 JAR 안에 있어 실행 JAR(BOOT-INF/lib)로 함께 간다.
    runtimeOnly libs.sqlite.jdbc
}
