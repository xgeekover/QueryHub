# Java toolchain(17)은 로컬에 설치된 JDK 에서만 찾는다 (현재 JVM, JAVA_HOME, macOS java_home, ~/.gradle/jdks 등 자동 감지).
# 닫힌 사내망에서도 같은 결과가 나오게 JDK 를 내려받지 않는다 (ADR-025). 다른 위치의 JDK 17 은
# ~/.gradle/gradle.properties 의 org.gradle.java.installations.paths 로 알려 준다.
org.gradle.java.installations.auto-download=false
