# 모든 프로파일 공통 설정.
# 프로파일을 지정하지 않으면 desktop 이다. 실수로 프로파일 없이 실행해도 루프백(127.0.0.1)에만 바인딩된다.
# 서버 배포는 SPRING_PROFILES_ACTIVE=server 로 명시해야 한다.
server:
  # 공통 기본 바인딩 주소는 루프백이다. 모든 인터페이스로 넓히는 것은 server 프로파일(application-server.yml)뿐이다.
  # 그래서 desktop 프로파일 파일이 적용되지 않는 경우(예: 다른 프로파일만 켠 경우)에도 외부 인터페이스에 열리지 않는다.
  address: 127.0.0.1
  # 관리 API 의 루프백 검사는 소켓의 원격 주소로 한다. X-Forwarded-For·Forwarded 로 원격 주소를 바꾸지 않도록 none 으로 고정한다.
  # queryhub.admin.allow-remote=false 인데 이 값이 none 이 아니면 기동을 거부한다 (AdminAccessConfiguration).
  forward-headers-strategy: none

spring:
  application:
    name: queryhub-runtime
  profiles:
    default: desktop
  web:
    # 오류 응답은 QueryHubErrorController 와 GlobalExceptionHandler 가 공통 형식으로 만든다.
    # Boot 기본 오류 속성에도 내부 정보가 들어가지 않게 막아 둔다.
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
      include-exception: false
    # 정적 리소스를 제공하지 않는다. 없는 경로는 NoHandlerFoundException -> 404 NOT_FOUND 가 된다.
    resources:
      add-mappings: false
  # Metadata 저장소: 내장 SQLite (P1-06, ADR-026). 파일은 <QUERYHUB_DATA_DIR>/queryhub.db 다. 데이터 디렉터리는 필수이고 기본값이 없다
  # (QUERYHUB_DATA_DIR 환경변수나 queryhub.data-dir 설정). JDBC URL 과 SQLite 설정(journal_mode=WAL, synchronous=FULL,
  # foreign_keys=ON, busy_timeout=5000, transaction_mode=IMMEDIATE)은 런타임이 정한다
  # (com.queryhub.app.config.metadata.MetadataDatabaseAutoConfiguration). desktop 과 server 가 같은 규칙을 쓴다.
  datasource:
    hikari:
      pool-name: queryhub-metadata
      # 동시 연결 수. WAL 이라 읽기는 쓰기와 함께 돌고, 쓰기는 SQLite 가 한 번에 하나씩 처리한다(busy_timeout 동안 기다린다).
      # 운영자가 바꿀 수 있다. 기동 검사는 이 수만큼 연결을 열어 SQLite 설정을 확인한다.
      maximum-pool-size: 4
      # 연결을 얻기까지의 최대 대기 시간(ms). 나머지는 Boot 기본값이다.
      connection-timeout: 10000
  flyway:
    # 마이그레이션은 adapter-metadata 의 db/migration 에 있다. 위치를 찾지 못하면 조용히 건너뛰지 않고 실패한다.
    locations: classpath:db/migration
    fail-on-missing-locations: true

management:
  endpoints:
    web:
      exposure:
        # health 만 공개한다. 나머지 actuator 엔드포인트는 404 다 (P1-03 부터 health 세 경로 밖은 토큰이 없으면 401).
        include: health
      # 엔드포인트 목록(/actuator)도 내지 않는다. 토큰이 있어도 404 다.
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        # /actuator/health/liveness, /actuator/health/readiness
        enabled: true

# 관리자 인증 (P1-03, ADR-021). 토큰은 이 파일에 두지 않는다: QUERYHUB_ADMIN_TOKEN 또는 QUERYHUB_ADMIN_TOKEN_FILE 로만 받고,
# 둘 다 없으면 기동을 거부한다. 명령행 인자, -D, spring.application.json 으로 넘긴 토큰도 거부한다.
queryhub:
  admin:
    # false: 관리 요청은 소켓 원격 주소가 루프백일 때만 받는다. server 프로파일만 true 로 넓힌다.
    allow-remote: false
