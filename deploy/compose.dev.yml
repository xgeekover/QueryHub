# 개발용 Metadata DB (MariaDB). 로컬 개발에서 런타임을 실행할 때만 쓴다. 테스트는 이 컨테이너를 쓰지 않는다(Testcontainers).
#
# 값은 같은 디렉터리의 .env(git 이 무시한다)에서 읽는다. 예시: deploy/env.example. 비밀번호에는 기본값이 없다.
# 메인 체크아웃에서만 실행한다. worktree 마다 실행하면 같은 이름의 컨테이너를 다시 만든다.
#   시작:     docker compose -f deploy/compose.dev.yml up -d --wait
#   중지:     docker compose -f deploy/compose.dev.yml stop
#   데이터 삭제: 중지한 뒤 docker compose -f deploy/compose.dev.yml rm -f metadata-db, 이어서 docker volume rm queryhub-dev-metadata-db
#
# 서버 설정은 명령행 옵션으로 둔다(호스트 경로를 바인드하지 않는다). 런타임은 서버 기본값에 기대지 않지만(DDL 이 utf8mb4 를 직접 적고 세션
# 시간대를 UTC 로 고정한다), 사람이 직접 접속할 때 헷갈리지 않도록 utf8mb4 와 UTC 를 기본으로 둔다.
name: queryhub-dev

services:
  metadata-db:
    # Testcontainers(MetadataMariaDb.IMAGE)와 같은 이미지.
    image: mariadb:12.3
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_uca1400_ai_ci
      - --default-time-zone=+00:00
    environment:
      MARIADB_DATABASE: ${QUERYHUB_METADATA_DB_NAME:-queryhub}
      MARIADB_USER: ${QUERYHUB_METADATA_DB_USERNAME:-queryhub}
      MARIADB_PASSWORD: ${QUERYHUB_METADATA_DB_PASSWORD:?QUERYHUB_METADATA_DB_PASSWORD 를 deploy/.env 에 지정하라 (deploy/env.example 참고)}
      # root 비밀번호는 무작위로 만든다(로그에 한 번 출력된다). 런타임은 root 를 쓰지 않는다.
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    ports:
      # 루프백에만 연다.
      - "127.0.0.1:${QUERYHUB_METADATA_DB_PORT:-13306}:3306"
    volumes:
      - metadata-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
    restart: "no"

volumes:
  metadata-db:
    name: queryhub-dev-metadata-db
