# QueryHub CI (P0-D, ADR-020).
#
# 상태: 2026-11-23 부터 공개 저장소 github.com/xgeekover/QueryHub 에서 push 로 실행된다(BACKLOG CI-1).
# P1-07(bb0cd8c) 코드를 돌린 실행 45194878756 의 결과(2회차는 실패한 작업만 다시 돌렸다, 2026-11-23):
# - gates (ubuntu-24.04): 1회차는 build.sh 에서 실패했다. Gradle 이 플러그인 클래스패스를 받는 중에 Maven Central 이
#   429 Too Many Requests 로 답했다(코드 문제가 아니다). 2회차는 성공했다(약 19분). selftest --no-skip 과 네 게이트 전체,
#   P1-07 의 MariaDB·PostgreSQL 통합 시험(Testcontainers), 깨끗한 작업 트리 확인이 돌았다.
# - desktop (macos-15, --desktop-only): 1회차는 러너가 배정되지 않아 15분 뒤 취소되었고(실행한 단계 0개), 2회차는 성공했다.
# - desktop (windows-2025, --desktop-only): 두 회차 모두 실패. test.sh 가 junit-check 자체 검증의 i6 에서 멈췄다:
#   ln: failed to create symbolic link '/tmp/queryhub-junit-selftest.*/i6-dangling-link/TEST-link.xml': No such file or directory
#   Git Bash 의 ln -s 는 기본으로 대상을 복사하므로 대상이 없는 링크를 만들지 못한다.
# 앞선 두 실행(P1-06 39c90e1 의 45135537429, MIT 라이선스 319c8ee 의 45139240703)도 gates 와 macOS 는 성공, Windows 는
#   같은 자리에서 실패였다.
# P1-07a(1bcf01b, 2026-11-24)는 이 파일이 아니라 selftest.sh 의 그 ln -s 한 명령에만 MSYS2 의 winsymlinks:native 설정을 주고,
#   그래도 깨진 링크를 만들지 못하면 이유를 적고 i6 을 SKIP 한다(desktop 작업의 인자 없는 selftest 는 SKIP 을 받고, gates 의
#   --no-skip 은 받지 않는다). 설정을 env 로 두는 해법은 workflow-check.sh 의 FORBIDDEN_ENV(MSYS*)가 거부하고, 그 규칙은
#   그대로다(BACKLOG CI-1).
# P1-07a 코드(공개 저장소의 de110e2)를 돌린 실행 45262721122 의 결과(2026-11-23 UTC, 2회차는 gates 만 다시 돌렸다):
# - desktop (windows-2025, --desktop-only): build.sh 는 통과했다. test.sh 의 selftest 에서 i6 는 PASS(깨진 링크를 [INVALID] 로
#   거부)였고 i1, c-i4 는 예상대로 SKIP 이었다. d11 하나가 실패했다:
#   docs-check.sh: line 22: /lib.sh: No such file or directory
#   d11 의 NO_SHA_BIN 에 복사된 도구가 MSYS 런타임 DLL 을 찾지 못해 시작하지 못한 것으로 본다(Windows 에서 확인하지 않았다).
#   P1-07b(019a9b8, 2026-11-24)는 이 파일이 아니라 selftest.sh 의 d11 픽스처만 고쳐, MSYS 에서만 도구 옆에 msys-*.dll 을 복사한다.
# - gates (ubuntu-24.04): 1회차는 test.sh 의 cargo test 에서 1건 실패했다(78건 통과). 감독의 데이터 디렉터리 시험이 포트 27699
#   에서 DataDirUnavailable 대신 PortInUse 를 받았다. 2회차는 성공했다. P1-07b 는 포트가 주제가 아닌 감독 시험에서 실제 포트
#   확인을 뺐다(TEST_PLAN 「CI」).
# - desktop (macos-15, --desktop-only): 1회차에 성공했다.
# P1-07b 코드(공개 저장소의 1a37405)를 돌린 실행 45291231932 의 결과:
# - gates (ubuntu-24.04), desktop (macos-15, --desktop-only): 성공했다.
# - desktop (windows-2025, --desktop-only): build.sh 와 test.sh 의 selftest(d11 PASS, SKIP 은 i1 과 c-i4 둘), vitest 는 통과했다.
#   cargo test --locked 는 exit 0(lib 시험 41 건 통과)이었지만 cargo-test-check.sh --require-lib 이 [LIB_WITHOUT_TESTS] 로 실패했다.
#   Windows 의 cargo 는 unittests 줄의 경로를 역슬래시로 찍고(src\lib.rs), cargo-test-check.sh 는 unittests src/lib.rs 만 맞춘다.
#   다음 막힘이고, 보호 파일이라 고치려면 사람의 결정이 필요하다(결정 대기). lint.sh 는 Windows 에서 아직 돌지 않았다(PLAT-1).
# P1-08a 코드(공개 저장소의 e1ae6fb)의 실행 45341111870: gates(통합 시험이 처음으로 Ryuk 없이 돌았다)와 macOS 는 성공, Windows 는
#   같은 [LIB_WITHOUT_TESTS] 에서 실패. 사람의 결정 「작은 태스크 P1-07c (권장)」(2026-11-24): P1-07c(커밋 전)는 이 파일이 아니라
#   cargo-test-check.sh 의 lib 블록 줄만 고쳐 src/lib.rs 와 src\lib.rs 를 모두 받는다. 그다음 Windows 단계 lint.sh 는 미검증이다.
#
# 팩토리 게이트와 같은 스크립트를 같은 명령으로 실행한다. gradle, pnpm, cargo 명령을 여기에 따로 적지 않는다. 그래서 거짓 통과
# 방어(junit-check.sh, cargo-test-check.sh, selftest.sh)가 로컬과 똑같이 적용된다. 이 파일은 workflow-check.sh 가 lint 단계에서
# 점검한다(SHA 고정, 권한, 금지 표현, checkout 의 persist-credentials, 팩토리 명령 네 줄). P1-01 부터는 줄 단위로 다룰 수 없는
# YAML 문법, continue-on-error, if:, bash 가 아닌 shell, run 값 안의 표현식도 거부한다. 그러니 이 파일은 블록 형식의 평범한
# 키와 값만 쓴다.
#
# - gates (ubuntu-24.04): 새 checkout 에서 네 게이트 전체를 인자 없이 실행하고, 끝나면 작업 트리가 깨끗한지 본다(P0B-R7).
#   통합 테스트는 Linux 컨테이너(Docker)가 필요해 이 작업에서만 돈다. Linux desktop(WebKitGTK)의 빌드·테스트·lint 도 여기서 한다.
# - desktop (macos-15, windows-2025): Java, Gradle, Docker 없이 build/test/lint 를 --desktop-only 로 실행한다. macOS 러너에는
#   Docker 가 없고 Windows 러너는 Windows 컨테이너만 돌린다.
#
# 고정:
# - action 은 모두 40자 커밋 SHA 와 '# 태그' 주석으로 고정한다. 2026-11-20 에 읽기 전용 git ls-remote --tags 로 찾았다.
#   기준: 14일 이상 지난 가장 새 릴리스.
# - 러너 레이블은 -latest 를 쓰지 않는다. -latest 레이블은 예고 없이 새 이미지(예: Ubuntu 26.04)로 옮겨 간다.
# - Rust 는 1.97.1 이다(로컬 기준 버전). Rust 1.100 은 Cargo 의 build-dir 배치를 바꾸었고, 이 크레이트가 쓰는 tauri-build 2.6.3 은
#   그 배치를 가정한다(NexTerm 의 같은 문제). 제3자 Rust action 대신 러너에 있는 rustup 을 쓴다.
# - 캐시는 의존성 캐시뿐이고 빌드 산출물은 없다(Gradle, pnpm store, cargo registry·git). target, node_modules, dist, build 는
#   캐시하지 않으므로 매 실행이 새 빌드다. 다만 setup-java 의 cache: gradle 은 ~/.gradle/caches 와 ~/.gradle/wrapper 를 담고,
#   그 안에는 Gradle 이 만든 데이터(transforms, 컴파일된 빌드 스크립트)도 있다. 복원한 캐시는 검증하지 않는다(Gradle 의존성
#   검증이 없다, BACKLOG CI-2).
# - 비밀 값이 필요 없다. 권한은 최상위 contents: read 하나이고 checkout 은 자격 증명을 남기지 않는다.
#
# 첫 실행에서 확인한 것: 세 러너 레이블, action 입력 이름, Linux WebKitGTK 빌드. 미검증: Windows 의 test.sh 와 lint.sh 단계.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  gates:
    name: gates (ubuntu-24.04, 팩토리 게이트 네 개)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # P0A-N1: root 는 권한 000 인 파일도 읽으므로 selftest 의 읽기 실패 시나리오가 SKIP 된다. CI 는 root 가 아니어야 한다.
      - name: root 가 아닌지 확인 (P0A-N1)
        run: |
          id -u
          test "$(id -u)" -ne 0

      # Tauri(WebKitGTK) 빌드에 필요한 패키지. NexTerm build.yml 과 같은 목록이다.
      - name: Linux desktop 의존 패키지 (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Java 17 (Temurin, Gradle 캐시)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: pnpm 11.9.0
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0

      - name: Node 24.16.0 (pnpm store 캐시)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Rust 1.97.1 (rustup, rustfmt, clippy)
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: cargo registry 캐시 (내려받은 것만)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-1.97.1-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      # 건너뛴 시나리오가 하나라도 있으면 실패한다. test.sh 와 integration.sh 는 selftest 를 인자 없이 부른다.
      - name: selftest --no-skip
        run: bash scripts/gate/selftest.sh --no-skip

      # 아래 네 줄은 팩토리 게이트 명령과 글자 그대로 같다(인자 없음).
      - name: build.sh
        run: bash scripts/gate/build.sh
      - name: test.sh
        run: bash scripts/gate/test.sh
      - name: lint.sh
        run: bash scripts/gate/lint.sh
      - name: integration.sh
        run: bash scripts/gate/integration.sh

      # P0B-R7: 게이트가 추적하지 않는 파일을 남기지 않아야 한다(산출물은 모두 .gitignore 에 걸린다).
      - name: 작업 트리가 깨끗한지 확인
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$status"
          test -z "$status"

  desktop:
    name: desktop (${{ matrix.os }}, --desktop-only)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: pnpm 11.9.0
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0

      - name: Node 24.16.0 (pnpm store 캐시)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Rust 1.97.1 (rustup, rustfmt, clippy)
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: cargo registry 캐시 (내려받은 것만)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-1.97.1-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      # runtime(Gradle) 단계만 뺀다. 마지막 줄이 'GATE PASS: <이름> (desktop-only, ...)' 로 범위를 밝힌다.
      - name: build.sh --desktop-only
        run: bash scripts/gate/build.sh --desktop-only
      - name: test.sh --desktop-only
        run: bash scripts/gate/test.sh --desktop-only
      - name: lint.sh --desktop-only
        run: bash scripts/gate/lint.sh --desktop-only
